name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend CI
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        working-directory: .
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Run backend tests
        run: |
          python -m pytest tests/ -v

  # Frontend CI
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install
      
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  # Deploy to server (小猪)
  deploy:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != ''
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_ROOT="${{ secrets.SERVER_APP_ROOT }}"
            [ -z "$APP_ROOT" ] && APP_ROOT="/root/.openclaw/workspace/ai-quant"
            cd "$APP_ROOT"
            git pull origin main
            pip install -r requirements.txt
            cd frontend && pnpm install && pnpm build && cd ..
            # 确保存在 .env（含 QUANT_AUTH_PASSWORD / TUSHARE_TOKEN），由服务器侧维护
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
